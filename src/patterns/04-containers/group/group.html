<div
    style="{{> initialStyle}}"
    data-module="Group"
    data-animation="{{#if animation}}{{animation}}{{else}}fade-in{{/if}}"
    data-duration="{{#if duration}}{{duration}}{{else}}400{{/if}}"
    data-styles="group{{#if styles}} {{styles}}{{/if}}"
    class="{{> initialAnimation}}{{#if modifier}} {{modifier}}{{/if}}">
    {{#>@partial-block}}{{/@partial-block }}
</div>
