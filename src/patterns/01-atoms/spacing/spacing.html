<main class="u-spacing-b-1">
    {{#each spacing}}
        <section class="{{this.modifier}} {{this.className}} Fractal-border-primary">
            <div class="l-row">
                <div class="l-row__col">
                    {{#> '@content' }}
                        <ul>
                            <li>{{this.name}}</li>
                            <li>ClassName: {{this.className}}</li>
                        </ul>
                    {{/@content}}
                </div>
            </div>
        </section>
    {{/each}}
</main>
