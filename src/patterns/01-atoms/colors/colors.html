<main class="u-spacing-b-1">
    {{#each colors}}
        <section class="u-spacing-t-1">
            <div class="l-row">
                <div class="l-row__col is-sml-7">
                    {{#> '@content' }}
                        <h1 class="u-h3">{{this.name}}</h1>
                        <p>{{this.description}}</p>
                        <hr>
                        <ul>
                            <li>Hex: {{this.hex}}</li>
                            <li>SCSS: <strong>{{this.scss}}</strong></li>
                        </ul>
                    {{/@content}}
                </div>
                <div class="l-row__col is-sml-3 is-justify-right">
                    <span class="Fractal-chip Fractal-border-primary" style="background-color: {{this.hex}};"></span>
                </div>
            </div>
        </section>
    {{/each}}
</main>
