<button
    data-module="Button"
    data-styles="button{{#if styles}} {{styles}}{{/if}}"
    {{#if label}}aria-label="{{label}}"{{/if}}
    class="{{#if modifier}} {{modifier}}{{/if}}"
    {{#if disabled}}disabled{{/if}}>
    {{#if text}}
    <span data-styles="button__inside">
        {{text}}
        {{#if icon}}<i class="u-icon-{{icon}}"></i>{{/if}}
    </span>
    {{/if}}
</button>
