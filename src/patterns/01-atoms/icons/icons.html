<main class="u-spacing-b-1">
    <section class="u-spacing-t-1">
        <div class="l-row">
            <div class="l-row__col">
                {{#> '@content' }}
                    {{#each applicationIcons}}
                        <ul>
                            <li><span class="u-h3">{{this.name}}: <i class="{{this.className}}"></i></span></li>
                            <li>ClassName: <strong>{{this.className}}</strong></li>
                        </ul>
                    {{/each}}
                {{/@content}}
            </div>
        </div>
    </section>
</main>
