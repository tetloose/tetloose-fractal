<figure
    data-module="Figure"
    data-duration="{{#if duration}}{{duration}}{{else}}400{{/if}}"
    data-styles="{{#if styles}} {{styles}}{{/if}}"
    data-alt="{{#if alt }}{{ alt }}{{/if}}"
    data-mobile="{{#if mobile }}{{ mobile }}{{/if}}"
    data-tablet="{{#if tablet }}{{ tablet }}{{/if}}"
    data-desktop="{{#if desktop }}{{ desktop }}{{/if}}"
    class="u-figure {{#if animation}}u-load-{{animation}}{{/if}}{{#if modifier}} {{modifier}}{{/if}}{{#if ratio}} u-ratio-{{ratio}}{{/if}}{{#if size}} is-{{size}}{{/if}}{{#if position}} is-{{position}}{{/if}}">
    {{ render '@loading--centered' }}
    {{#if placeholder }}
        <img
            data-placeholder="true"
            class="u-figure__img"
            src="{{ placeholder }}"
            alt="">
    {{/if}}
</figure>
