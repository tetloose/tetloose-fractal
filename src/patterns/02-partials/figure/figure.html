{{#if image}}
<figure
    data-module="Figure"
    data-type="figure"
    data-duration="{{#if duration}}{{duration}}{{else}}400{{/if}}"
    data-styles="figure{{#if styles}} {{styles}}{{/if}}"
    data-image-class-name="{{#if image.modifier}}{{image.modifier}}{{/if}}"
    data-image-styles="figure__img{{#if image.styles}} {{image.styles}}{{/if}}"
    data-image-alt="{{#if image.alt }}{{ image.alt }}{{/if}}"
    data-image-mobile="{{#if image.mobile }}{{ image.mobile }}{{/if}}"
    data-image-tablet="{{#if image.tablet }}{{ image.tablet }}{{/if}}"
    data-image-desktop="{{#if image.desktop }}{{ image.desktop }}{{/if}}"
    class="{{#if animation}}u-animate-{{animation}}{{/if}}{{#if modifier}} {{modifier}}{{/if}}{{#if ratio}} u-ratio-{{ratio}}{{/if}}">
    {{ render '@loading--centered' }}
    {{#if image.placeholder }}
        <img
            class="js-figurePlaceholder"
            src="{{ image.placeholder }}"
            alt="">
    {{/if}}
</figure>
{{/if}}
